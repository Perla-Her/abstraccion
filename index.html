<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgujeroNegro — simulación POO</title>

  <!-- Aquí conectamos el archivo de estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="eyebrow">Simulación — clase AgujeroNegro</div>
    <h1>Diagrama vivo de un agujero negro</h1>
  </header>

  <canvas id="c" height="380"></canvas>

  <div class="deck">

    <!-- ATRIBUTOS -->
    <div class="panel">
      <h2>Atributos</h2>

      <div class="attr-row">
        <div class="attr-label"><span>masa</span><span id="v-masa">10 M☉</span></div>
        <input id="masa" type="range" min="1" max="50" step="0.5" value="10">
      </div>

      <div class="attr-row">
        <div class="attr-label"><span>spin (a*)</span><span id="v-spin">0.00</span></div>
        <input id="spin" type="range" min="0" max="0.99" step="0.01" value="0">
      </div>

      <div class="attr-row">
        <div class="attr-label"><span>carga</span><span id="v-carga">0.00</span></div>
        <input id="carga" type="range" min="0" max="1" step="0.01" value="0">
      </div>

      <div class="attr-row">
        <div class="attr-label"><span>tipo</span><span></span></div>
        <span class="tipo-badge" id="v-tipo">Schwarzschild</span>
      </div>
    </div>

    <!-- METODOS -->
    <div class="panel">
      <h2>Métodos</h2>
      <div class="methods">
        <button id="btn-mover">moverse(dt, fuerza)</button>
        <button id="btn-fusionar">fusionar(otro)</button>
        <button id="btn-hawking">emitirRadiacionHawking(dt)</button>
        <button id="btn-radio">calcularRadioSchwarzschild()</button>
      </div>
    </div>

  </div>

  <!-- Panel de datos -->
  <div class="telemetry">
    <div><span class="k">radioSchwarzschild()</span><span class="v" id="t-rs">—</span></div>
    <div><span class="k">horizonteEventos (r+)</span><span class="v" id="t-rh">—</span></div>
    <div><span class="k">temperaturaHawking()</span><span class="v" id="t-temp">—</span></div>
    <div><span class="k">luminosidad()</span><span class="v" id="t-lum">—</span></div>
  </div>

  <!-- Consola -->
  <div class="log" id="log"></div>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
